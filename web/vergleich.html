<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Tippduell</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Tippduell: zwei Bots im gleichen Format (tippduell/1) nebeneinander.
   Nur per Link erreichbar, nicht in der App verlinkt. */
:root {
  --bg: #F2F4F1; --surface: #FFFFFF; --sunken: #E8ECE8; --ink: #121A16; --muted: #5B6760; --line: #D7DDD8;
  --a: #0D6A46; --b: #2E4E9E; --good: #0D6A46; --bad: #B13A2F;
  --font-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --radius: 6px; color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1310; --surface: #151D19; --sunken: #1C2621; --ink: #E6ECE8; --muted: #93A099; --line: #27322C;
    --a: #47BF89; --b: #8DA5F0; --good: #47BF89; --bad: #EE7B6F; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1310; --surface: #151D19; --sunken: #1C2621; --ink: #E6ECE8; --muted: #93A099; --line: #27322C;
  --a: #47BF89; --b: #8DA5F0; --good: #47BF89; --bad: #EE7B6F; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font-body); -webkit-font-smoothing: antialiased; }
main { max-width: 920px; margin: 0 auto; padding: calc(20px + env(safe-area-inset-top, 0px)) 16px 48px; }
h1, h2, h3 { font-family: var(--font-display); text-transform: uppercase; letter-spacing: .01em; margin: 0; }
.muted { color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.sec { display: flex; align-items: center; gap: 12px; font-size: 19px; margin: 30px 0 12px; color: var(--muted); }
.sec::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.a { color: var(--a); } .b { color: var(--b); }

/* Kopf: A gegen B */
.vs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 12px; }
.vs .side { min-width: 0; }
.vs .side:last-child { text-align: right; }
.vs .name { font: 700 clamp(24px, 6.4vw, 52px)/.95 var(--font-display); text-transform: uppercase; overflow-wrap: anywhere; }
.vs .who { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.vs .mid { font: 700 20px/1 var(--font-display); color: var(--muted); padding-bottom: 8px; }
.score { display: flex; justify-content: center; gap: 10px; margin: 18px 0 4px; font: 700 15px/1 var(--font-display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.score b { font-size: 34px; color: var(--ink); letter-spacing: 0; }
.score .lead-a b:first-child, .score .lead-b b:last-child { text-decoration: underline 3px; text-underline-offset: 6px; }
.score .lead-a b:first-child { text-decoration-color: var(--a); } .score .lead-b b:last-child { text-decoration-color: var(--b); }

.chips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin: 16px 0 0; }
.chip { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 7px 13px; font: 600 13px/1 var(--font-body); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* Duell-Zeilen: gespiegelte Balken */
.rows { padding: 4px 16px; }
.row { display: grid; grid-template-columns: 1fr minmax(96px, auto) 1fr; gap: 10px; align-items: center; padding: 11px 0; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row .lbl { text-align: center; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.row .lbl small { display: block; font-weight: 500; letter-spacing: 0; text-transform: none; font-size: 11.5px; }
.val { display: flex; align-items: center; gap: 8px; min-width: 0; }
.val.l { flex-direction: row-reverse; }
.val b { font: 700 22px/1 var(--font-display); font-variant-numeric: tabular-nums; white-space: nowrap; }
.val .bar { flex: 1; height: 6px; background: var(--sunken); border-radius: 3px; overflow: hidden; display: flex; }
.val.l .bar { justify-content: flex-end; }
.val .bar i { display: block; height: 100%; border-radius: 3px; }
.val.l .bar i { background: var(--a); } .val.r .bar i { background: var(--b); }
.val.win b::after { content: " ◆"; font-size: 11px; vertical-align: 4px; }
.val.l.win b::after { color: var(--a); } .val.r.win b::after { color: var(--b); }
.val.dim b { color: var(--muted); }

/* Challenge-Karten */
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 640px) { .two { grid-template-columns: 1fr; } }
.ch { padding: 16px; border-top: 3px solid var(--a); }
.ch.bside { border-top-color: var(--b); }
.ch .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.ch .bank { font: 700 38px/1 var(--font-display); margin: 8px 0 2px; font-variant-numeric: tabular-nums; }
.ch .bank small { font-size: 17px; color: var(--muted); margin-left: 3px; }
.ch dl { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0 0; }
.ch dt { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.ch dd { margin: 2px 0 0; font: 700 18px/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.ch .cur { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); font-size: 13.5px; }
.ch .cur small { display: block; color: var(--muted); font-size: 12.5px; }
.track { position: relative; height: 6px; background: var(--sunken); border-radius: 3px; margin-top: 12px; }
.track i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--a); }
.ch.bside .track i { background: var(--b); }
.track em { position: absolute; top: -4px; width: 2px; height: 14px; background: var(--muted); }

/* Gleiche Spiele */
.same { list-style: none; margin: 0; padding: 0; }
.same li { padding: 11px 16px; border-top: 1px solid var(--line); }
.same li:first-child { border-top: 0; }
.same .m { font-size: 12.5px; color: var(--muted); }
.same .picks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 5px; font-size: 14px; }
.same .picks span:last-child { text-align: right; }
.st { font-weight: 700; }
.st.won { color: var(--good); } .st.lost { color: var(--bad); } .st.open, .st.void { color: var(--muted); font-weight: 600; }

/* Tipp-Listen */
.lists { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 640px) { .lists { grid-template-columns: 1fr; } .lists.one-a .lb, .lists.one-b .la { display: none; } }
.lists .head { padding: 12px 16px 6px; font: 700 18px/1 var(--font-display); text-transform: uppercase; }
.lists .la .head { color: var(--a); } .lists .lb .head { color: var(--b); }
.tips { list-style: none; margin: 0; padding: 0 0 4px; }
.tips li { display: flex; justify-content: space-between; gap: 10px; padding: 9px 16px; border-top: 1px solid var(--line); font-size: 14px; }
.tips small { display: block; color: var(--muted); font-size: 12.5px; }
.tips .r { text-align: right; white-space: nowrap; font-size: 13px; }
.mob-tabs { display: none; }
@media (max-width: 640px) { .mob-tabs { display: flex; } }

svg.chart { width: 100%; height: 220px; display: block; }
.legend { display: flex; gap: 16px; font-size: 12.5px; color: var(--muted); padding: 12px 16px 0; }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
.empty { padding: 22px 16px; text-align: center; color: var(--muted); font-size: 14px; }
.empty strong { display: block; color: var(--ink); font-size: 15px; margin-bottom: 4px; }
.note { font-size: 12.5px; color: var(--muted); margin: 12px 2px 0; }
footer { margin-top: 36px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<main id="app"><div class="empty">Lädt …</div></main>
<script>
(() => {
  // ------------------------------------------------------------------
  // Hier die URL zur duel.json des Gegners eintragen (oder ?b=URL anhängen).
  const PARTNER_URL = "";
  // ------------------------------------------------------------------
  const qs = new URLSearchParams(location.search);
  const SRC = [qs.get("a") || "duel.json", qs.get("b") || PARTNER_URL];

  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fDay = new Intl.DateTimeFormat("de-CH", { weekday: "short", day: "2-digit", month: "2-digit", timeZone: "Europe/Zurich" });
  const fDate = new Intl.DateTimeFormat("de-CH", { day: "2-digit", month: "2-digit", year: "2-digit", timeZone: "Europe/Zurich" });
  const fStamp = new Intl.DateTimeFormat("de-CH", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit", timeZone: "Europe/Zurich" });
  const pct = (x) => (x == null || isNaN(x) ? "–" : Math.round(x * 100) + "%");
  const num = (x, d = 2) => (x == null || isNaN(x) ? "–" : (x < 0 ? "−" : "") + Math.abs(x).toLocaleString("de-CH", { minimumFractionDigits: d, maximumFractionDigits: d }));
  const signed = (x, d = 1) => (x == null || isNaN(x) ? "–" : (x > 0 ? "+" : x < 0 ? "−" : "") + Math.abs(x).toLocaleString("de-CH", { minimumFractionDigits: d, maximumFractionDigits: d }));
  const STATUS = { won: "✓", lost: "✗", void: "abgesagt", open: "offen" };

  let A = null, B = null, errB = "", period = "common", mobSide = "a";

  async function load(url) {
    const r = await fetch(url + (url.includes("?") ? "&" : "?") + "t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    if (!j || !String(j.format || "").startsWith("tippduell/")) throw new Error("kein tippduell-Format");
    j.tips = (j.tips || []).filter((t) => !t.retro);   // nur live getippte Tipps zählen
    return j;
  }

  // ---------- Kennzahlen ----------
  function inPeriod(t, from) { return !from || (t.placed || t.kickoff) >= from; }
  function stats(bot, from) {
    const tips = bot.tips.filter((t) => inPeriod(t, from));
    const done = tips.filter((t) => t.status === "won" || t.status === "lost");
    const won = done.filter((t) => t.status === "won");
    const mk = done.filter((t) => t.odds_type === "market" && t.odds);
    const profit = mk.reduce((s, t) => s + (t.status === "won" ? t.odds - 1 : -1), 0);
    const days = {};
    done.forEach((t) => { (days[t.day] = days[t.day] || []).push(t); });
    const dayRates = Object.values(days);
    return {
      tips: tips.length, done: done.length, won: won.length,
      rate: done.length ? won.length / done.length : null,
      avgOdds: done.length ? done.reduce((s, t) => s + (t.odds || 0), 0) / done.length : null,
      avgP: done.length ? done.reduce((s, t) => s + (t.probability || 0), 0) / done.length : null,
      mk: mk.length, profit: mk.length ? profit : null, roi: mk.length ? profit / mk.length : null,
      perfect: dayRates.filter((d) => d.every((t) => t.status === "won")).length, days: dayRates.length,
    };
  }
  function chStats(bot) {
    const c = bot.challenge;
    if (!c || !c.attempts || !c.attempts.length) return null;
    const bets = c.attempts.flatMap((a) => a.bets || []);
    const done = bets.filter((b) => b.status === "won" || b.status === "lost");
    const cur = c.attempts[c.attempts.length - 1];
    const wins = (a) => (a.bets || []).filter((b) => b.status === "won").length;
    return {
      c, cur, attempts: c.attempts.length,
      peak: Math.max(...c.attempts.map((a) => a.peak || c.start)),
      bestWins: Math.max(...c.attempts.map(wins)), curWins: wins(cur),
      rate: done.length ? done.filter((b) => b.status === "won").length / done.length : null, done: done.length,
      goals: c.attempts.filter((a) => a.status === "won").length,
      open: (cur.bets || []).find((b) => b.status === "open"),
    };
  }

  // ---------- Gleiche Spiele finden ----------
  const STOP = new Set(["fc", "cf", "sc", "ac", "afc", "ssc", "us", "as", "sv", "vfb", "vfl", "tsg", "fk", "sk", "cd", "ud", "rc", "real", "club", "de", "the", "1", "04", "05", "1899", "1909", "1846", "1910"]);
  const toks = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9 ]+/g, " ").split(" ").filter((w) => w && !STOP.has(w));
  const sameTeam = (x, y) => { const a = toks(x), b = toks(y); return a.some((p) => b.some((q) => p.slice(0, 5) === q.slice(0, 5) && Math.min(p.length, q.length) >= 3)); };
  const dayOf = (iso) => (iso || "").slice(0, 10);
  function overlaps(from) {
    const out = [], seen = new Set();
    const latest = (ts) => ts.slice().sort((x, y) => ((y.placed || "") > (x.placed || "") ? 1 : -1));
    const bt = latest(B.tips.filter((t) => inPeriod(t, from)));
    latest(A.tips.filter((t) => inPeriod(t, from))).forEach((a) => {
      const k = dayOf(a.kickoff) + toks(a.home).join("") + toks(a.away).join("");
      if (seen.has(k)) return;   // gleiches Spiel an mehreren Tagen getippt: nur der neueste Tipp
      seen.add(k);
      const b = bt.find((t) => dayOf(t.kickoff) === dayOf(a.kickoff) && sameTeam(t.home, a.home) && sameTeam(t.away, a.away));
      if (b) out.push([a, b]);
    });
    return out.sort((x, y) => (y[0].kickoff > x[0].kickoff ? 1 : -1));
  }

  // ---------- Darstellung ----------
  function duelRow(label, sub, va, vb, fmt, better = "high") {
    const ok = va != null && vb != null && !isNaN(va) && !isNaN(vb);
    const max = ok ? Math.max(Math.abs(va), Math.abs(vb)) || 1 : 1;
    const w = (v) => (v == null || isNaN(v) ? 0 : Math.max(3, Math.abs(v) / max * 100));
    const winA = ok && (better === "high" ? va > vb : va < vb), winB = ok && (better === "high" ? vb > va : vb < va);
    return `<div class="row">
      <div class="val l ${winA ? "win" : ""} ${va == null ? "dim" : ""}"><b>${fmt(va)}</b><span class="bar"><i style="width:${w(va)}%"></i></span></div>
      <div class="lbl">${label}${sub ? `<small>${sub}</small>` : ""}</div>
      <div class="val r ${winB ? "win" : ""} ${vb == null ? "dim" : ""}"><b>${fmt(vb)}</b><span class="bar"><i style="width:${w(vb)}%"></i></span></div></div>`;
  }
  function chartSvg(from) {
    const series = [A, B].map((bot) => {
      const done = bot.tips.filter((t) => inPeriod(t, from) && (t.status === "won" || t.status === "lost"))
        .sort((x, y) => (x.kickoff > y.kickoff ? 1 : -1));
      let w = 0;
      return done.map((t, i) => { w += t.status === "won"; return [i + 1, w / (i + 1)]; });
    });
    const n = Math.max(...series.map((s) => s.length));
    if (n < 2) return `<div class="empty">Die Kurve erscheint, sobald beide Bots ein paar abgerechnete Tipps haben.</div>`;
    const W = 600, H = 220, pad = 30;
    const x = (i) => pad + (i - 1) / Math.max(1, n - 1) * (W - pad - 8), y = (v) => 10 + (1 - v) * (H - 40);
    const path = (s) => s.map((p, i) => `${i ? "L" : "M"}${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join("");
    const grid = [0, .25, .5, .75, 1].map((v) => `<line x1="${pad}" x2="${W - 8}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pad - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${v * 100}%</text>`).join("");
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Trefferquote im Verlauf">${grid}
      <path d="${path(series[0])}" fill="none" stroke="var(--a)" stroke-width="2.5" vector-effect="non-scaling-stroke"/>
      <path d="${path(series[1])}" fill="none" stroke="var(--b)" stroke-width="2.5" vector-effect="non-scaling-stroke"/>
      <text x="${W - 8}" y="${H - 6}" text-anchor="end" font-size="11" fill="var(--muted)">abgerechnete Tipps →</text></svg>`;
  }
  function chCard(bot, s, cls) {
    if (!s) return `<div class="panel ch ${cls}"><div class="top"><h3>${esc(bot.bot.name)}</h3></div><div class="empty">Keine Challenge-Daten.</div></div>`;
    const pos = (v) => Math.max(0, Math.min(100, Math.log(Math.max(v, s.c.start) / s.c.start) / Math.log(s.c.goal / s.c.start) * 100));
    const o = s.open;
    return `<div class="panel ch ${cls}">
      <div class="top"><h3>${esc(bot.bot.name)}</h3><span class="muted" style="font-size:12.5px">Versuch ${s.cur.n} · ${s.curWins} ${s.curWins === 1 ? "Sieg" : "Siege"}</span></div>
      <div class="bank">${num(s.cur.bank)}<small>${esc(s.c.currency || "CHF")}</small></div>
      <div class="track"><i style="width:${Math.max(1.5, pos(s.cur.bank))}%"></i>${s.peak > s.cur.bank ? `<em style="left:${pos(s.peak)}%" title="Rekord"></em>` : ""}</div>
      <dl><div><dt>Rekord</dt><dd>${num(s.peak, 0)}</dd></div><div><dt>Versuche</dt><dd>${s.attempts}</dd></div><div><dt>Treffer</dt><dd>${pct(s.rate)}</dd></div></dl>
      ${o ? `<div class="cur"><b>${o.legs.length > 1 ? o.legs.length + "er-Kombi" : esc(o.legs[0].label)}</b> · Quote ${num(o.odds)}
        <small>${o.legs.map((l) => `${esc(l.home)} – ${esc(l.away)}${o.legs.length > 1 ? " (" + esc(l.label) + ")" : ""}`).join(" + ")}</small>
        <small>${num(o.stake)} → ${num(o.stake * o.odds)} · Chance ${pct(o.probability)}</small></div>` : `<div class="cur"><small>Gerade keine Wette offen.</small></div>`}
    </div>`;
  }
  const tipLi = (t) => `<li><span><b>${esc(t.label)}</b><small>${esc(t.home)} – ${esc(t.away)} · ${esc(fDay.format(new Date(t.kickoff)))}</small></span>
    <span class="r"><span class="st ${t.status}">${STATUS[t.status] || ""}${t.score ? " " + esc(t.score) : ""}</span><br><span class="muted">${num(t.odds)}${t.odds_type === "fair" ? " fair" : ""}</span></span></li>`;

  function render() {
    const app = $("#app");
    const nameA = A ? A.bot.name : "GoalOracle", nameB = B ? B.bot.name : "Gegner";
    const head = `<div class="vs"><div class="side"><div class="name a">${esc(nameA)}</div><div class="who">${A ? esc(A.bot.owner || "") + " · Stand " + esc(fStamp.format(new Date(A.updated))) : ""}</div></div>
      <div class="mid">VS</div>
      <div class="side"><div class="name b">${esc(nameB)}</div><div class="who">${B ? esc(B.bot.owner || "") + " · Stand " + esc(fStamp.format(new Date(B.updated))) : ""}</div></div></div>`;
    if (!A) { app.innerHTML = head + `<div class="panel empty" style="margin-top:20px"><strong>Eigene Daten fehlen</strong>duel.json konnte nicht geladen werden.</div>`; return; }
    if (!B) {
      app.innerHTML = head + `<div class="panel empty" style="margin-top:20px"><strong>${SRC[1] ? "Daten des Gegners nicht erreichbar" : "Gegner noch nicht verbunden"}</strong>${SRC[1]
        ? `Unter <code>${esc(SRC[1])}</code> kam keine gültige tippduell-Datei (${esc(errB)}). Die Datei muss öffentlich und ohne Login erreichbar sein.`
        : "Sobald die URL zu seiner duel.json eingetragen ist, erscheint hier der Vergleich."}</div>` + soloView();
      return;
    }
    const firstOf = (bot) => bot.tips.reduce((m, t) => (!m || (t.placed || t.kickoff) < m ? t.placed || t.kickoff : m), null);
    const common = [firstOf(A), firstOf(B)].filter(Boolean).sort().pop();
    const from = period === "common" ? common : null;
    const sa = stats(A, from), sb = stats(B, from), ca = chStats(A), cb = chStats(B);
    const rows = [
      duelRow("Trefferquote", `${sa.won}/${sa.done} · ${sb.won}/${sb.done}`, sa.rate, sb.rate, pct),
      duelRow("Gewinn", "Einheiten, nur echte Quoten", sa.profit, sb.profit, (v) => signed(v)),
      duelRow("ROI", "pro Einsatz", sa.roi, sb.roi, (v) => (v == null ? "–" : signed(v * 100, 0) + "%")),
      duelRow("Ø Quote", "der abgerechneten Tipps", sa.avgOdds, sb.avgOdds, (v) => num(v)),
      duelRow("Alle richtig", "Tage ohne Fehler", sa.perfect, sb.perfect, (v) => (v == null ? "–" : String(v))),
      duelRow("Tipps", "abgegeben", sa.tips, sb.tips, (v) => String(v ?? "–")),
    ];
    if (ca && cb) rows.push(
      duelRow("Challenge", "Rekord", ca.peak, cb.peak, (v) => num(v, 0)),
      duelRow("Challenge", "Siege in Folge (Rekord)", ca.bestWins, cb.bestWins, (v) => String(v)));
    // Punkte: wer führt in wie vielen Kategorien
    const cmp = [[sa.rate, sb.rate], [sa.profit, sb.profit], [sa.perfect, sb.perfect]].concat(ca && cb ? [[ca.peak, cb.peak]] : []);
    let pa = 0, pb = 0; cmp.forEach(([x, y]) => { if (x != null && y != null) { if (x > y) pa++; else if (y > x) pb++; } });
    const ov = overlaps(from);
    app.innerHTML = head + `
      <div class="score ${pa > pb ? "lead-a" : pb > pa ? "lead-b" : ""}"><b>${pa}</b><span style="align-self:center">Kategorien</span><b>${pb}</b></div>
      <div class="chips" role="group" aria-label="Zeitraum">
        <button class="chip" data-p="common" aria-pressed="${period === "common"}">Seit gemeinsamem Start${common ? " (" + esc(fDate.format(new Date(common))) + ")" : ""}</button>
        <button class="chip" data-p="all" aria-pressed="${period === "all"}">Alles</button></div>
      <h2 class="sec">Tipps</h2>
      <div class="panel rows">${rows.join("")}</div>
      <p class="note">Gezählt werden nur live abgegebene Tipps (keine nachträglich berechneten). Gewinn und ROI: 1 Einheit Einsatz pro Tipp, nur Tipps mit echter Buchmacher-Quote. ◆ = vorne.</p>
      <h2 class="sec">Trefferquote im Verlauf</h2>
      <div class="panel"><div class="legend"><span><i style="background:var(--a)"></i>${esc(nameA)}</span><span><i style="background:var(--b)"></i>${esc(nameB)}</span></div><div style="padding:6px 8px 10px">${chartSvg(from)}</div></div>
      <h2 class="sec">Challenge 100 → 100'000</h2>
      <div class="two">${chCard(A, ca, "")}${chCard(B, cb, "bside")}</div>
      <h2 class="sec">Gleiche Spiele</h2>
      <div class="panel">${ov.length ? `<ul class="same">${ov.slice(0, 40).map(([a, b]) => `<li><div class="m">${esc(a.home)} – ${esc(a.away)} · ${esc(fDay.format(new Date(a.kickoff)))}${a.score ? " · " + esc(a.score) : ""}</div>
        <div class="picks"><span><span class="a" style="font-weight:600">${esc(a.label)}</span> <span class="st ${a.status}">${STATUS[a.status]}</span></span><span><span class="st ${b.status}">${STATUS[b.status]}</span> <span class="b" style="font-weight:600">${esc(b.label)}</span></span></div></li>`).join("")}</ul>`
        : `<div class="empty">Noch kein Spiel, das beide getippt haben.</div>`}</div>
      <h2 class="sec">Letzte Tipps</h2>
      <div class="chips mob-tabs" role="group"><button class="chip" data-s="a" aria-pressed="${mobSide === "a"}">${esc(nameA)}</button><button class="chip" data-s="b" aria-pressed="${mobSide === "b"}">${esc(nameB)}</button></div>
      <div class="lists one-${mobSide}" style="margin-top:10px">
        <div class="panel la"><div class="head">${esc(nameA)}</div><ul class="tips">${recent(A, from)}</ul></div>
        <div class="panel lb"><div class="head">${esc(nameB)}</div><ul class="tips">${recent(B, from)}</ul></div></div>
      <footer>Format tippduell/1 · Daten: <a href="${esc(SRC[0])}" style="color:inherit">${esc(nameA)}</a> · <a href="${esc(SRC[1])}" style="color:inherit">${esc(nameB)}</a></footer>`;
  }
  const recent = (bot, from) => bot.tips.filter((t) => inPeriod(t, from)).sort((x, y) => (y.kickoff > x.kickoff ? 1 : -1)).slice(0, 15).map(tipLi).join("") || `<li class="muted">Noch keine Tipps.</li>`;
  function soloView() {
    const s = stats(A, null), c = chStats(A);
    return `<h2 class="sec">${esc(A.bot.name)} bisher</h2>
      <div class="panel rows">${duelRow("Trefferquote", `${s.won}/${s.done}`, s.rate, null, pct)}${duelRow("Gewinn", "Einheiten, nur echte Quoten", s.profit, null, (v) => signed(v))}${duelRow("Tipps", "abgegeben", s.tips, null, (v) => String(v ?? "–"))}</div>
      <h2 class="sec">Challenge</h2><div class="two">${chCard(A, c, "")}</div>
      <h2 class="sec">Letzte Tipps</h2><div class="panel"><ul class="tips">${recent(A, null)}</ul></div>`;
  }
  document.addEventListener("click", (e) => {
    const p = e.target.closest("[data-p]"); if (p) { period = p.dataset.p; render(); return; }
    const s = e.target.closest("[data-s]"); if (s) { mobSide = s.dataset.s; render(); }
  });
  Promise.all([load(SRC[0]).catch(() => null), SRC[1] ? load(SRC[1]).catch((e) => { errB = e.message; return null; }) : Promise.resolve(null)])
    .then(([a, b]) => { A = a; B = b; render(); });
})();
</script>
</body>
</html>
