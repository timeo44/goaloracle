<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Challenge-Duell</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Tippduell: zwei Bots im gleichen Format (tippduell/1) nebeneinander.
   Nur per Link erreichbar, nicht in der App verlinkt. */
:root {
  --bg: #F2F4F1; --surface: #FFFFFF; --sunken: #E8ECE8; --ink: #121A16; --muted: #5B6760; --line: #D7DDD8;
  --a: #0D6A46; --b: #2E4E9E; --good: #0D6A46; --bad: #B13A2F;
  --font-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --radius: 6px; color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1310; --surface: #151D19; --sunken: #1C2621; --ink: #E6ECE8; --muted: #93A099; --line: #27322C;
    --a: #47BF89; --b: #8DA5F0; --good: #47BF89; --bad: #EE7B6F; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1310; --surface: #151D19; --sunken: #1C2621; --ink: #E6ECE8; --muted: #93A099; --line: #27322C;
  --a: #47BF89; --b: #8DA5F0; --good: #47BF89; --bad: #EE7B6F; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font-body); -webkit-font-smoothing: antialiased; }
main { max-width: 920px; margin: 0 auto; padding: calc(20px + env(safe-area-inset-top, 0px)) 16px 48px; }
h1, h2, h3 { font-family: var(--font-display); text-transform: uppercase; letter-spacing: .01em; margin: 0; }
.muted { color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.sec { display: flex; align-items: center; gap: 12px; font-size: 19px; margin: 30px 0 12px; color: var(--muted); }
.sec::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.a { color: var(--a); } .b { color: var(--b); }

/* Kopf: A gegen B */
.vs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 12px; }
.vs .side { min-width: 0; }
.vs .side:last-child { text-align: right; }
.vs .name { font: 700 clamp(22px, 5.6vw, 52px)/.95 var(--font-display); text-transform: uppercase; overflow-wrap: anywhere; }
.vs .who { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.vs .mid { font: 700 20px/1 var(--font-display); color: var(--muted); padding-bottom: 8px; }
.score { display: flex; justify-content: center; gap: 10px; margin: 18px 0 4px; font: 700 15px/1 var(--font-display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.score b { font-size: 34px; color: var(--ink); letter-spacing: 0; }
.score .lead-a b:first-child, .score .lead-b b:last-child { text-decoration: underline 3px; text-underline-offset: 6px; }
.score .lead-a b:first-child { text-decoration-color: var(--a); } .score .lead-b b:last-child { text-decoration-color: var(--b); }

.chips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin: 16px 0 0; }
.chip { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 7px 13px; font: 600 13px/1 var(--font-body); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* Duell-Zeilen: gespiegelte Balken */
.rows { padding: 4px 16px; }
.row { display: grid; grid-template-columns: 1fr minmax(96px, auto) 1fr; gap: 10px; align-items: center; padding: 11px 0; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row .lbl { text-align: center; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.row .lbl small { display: block; font-weight: 500; letter-spacing: 0; text-transform: none; font-size: 11.5px; }
.val { display: flex; align-items: center; gap: 8px; min-width: 0; }
.val.l { flex-direction: row-reverse; }
.val b { font: 700 22px/1 var(--font-display); font-variant-numeric: tabular-nums; white-space: nowrap; }
.val .bar { flex: 1; height: 6px; background: var(--sunken); border-radius: 3px; overflow: hidden; display: flex; }
.val.l .bar { justify-content: flex-end; }
.val .bar i { display: block; height: 100%; border-radius: 3px; }
.val.l .bar i { background: var(--a); } .val.r .bar i { background: var(--b); }
.val.win b::after { content: " ◆"; font-size: 11px; vertical-align: 4px; }
.val.l.win b::after { color: var(--a); } .val.r.win b::after { color: var(--b); }
.val.dim b { color: var(--muted); }

/* Challenge-Karten */
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 640px) { .two { grid-template-columns: 1fr; } }
.ch { padding: 16px; border-top: 3px solid var(--a); }
.ch.bside { border-top-color: var(--b); }
.ch .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.ch .bank { font: 700 38px/1 var(--font-display); margin: 8px 0 2px; font-variant-numeric: tabular-nums; }
.ch .bank small { font-size: 17px; color: var(--muted); margin-left: 3px; }
.ch dl { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0 0; }
.ch dt { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.ch dd { margin: 2px 0 0; font: 700 18px/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.ch .cur { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); font-size: 13.5px; }
.ch .cur small { display: block; color: var(--muted); font-size: 12.5px; }
.track { position: relative; height: 6px; background: var(--sunken); border-radius: 3px; margin-top: 12px; }
.track i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--a); }
.ch.bside .track i { background: var(--b); }
.track em { position: absolute; top: -4px; width: 2px; height: 14px; background: var(--muted); }

/* Gleiche Spiele */
.same { list-style: none; margin: 0; padding: 0; }
.same li { padding: 11px 16px; border-top: 1px solid var(--line); }
.same li:first-child { border-top: 0; }
.same .m { font-size: 12.5px; color: var(--muted); }
.same .picks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 5px; font-size: 14px; }
.same .picks span:last-child { text-align: right; }
.st { font-weight: 700; }
.st.won { color: var(--good); } .st.lost { color: var(--bad); } .st.open, .st.void { color: var(--muted); font-weight: 600; }

/* Tipp-Listen */
.lists { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 640px) { .lists { grid-template-columns: 1fr; } .lists.one-a .lb, .lists.one-b .la { display: none; } }
.lists .head { padding: 12px 16px 6px; font: 700 18px/1 var(--font-display); text-transform: uppercase; }
.lists .la .head { color: var(--a); } .lists .lb .head { color: var(--b); }
.tips { list-style: none; margin: 0; padding: 0 0 4px; }
.tips li { display: flex; justify-content: space-between; gap: 10px; padding: 9px 16px; border-top: 1px solid var(--line); font-size: 14px; }
.tips small { display: block; color: var(--muted); font-size: 12.5px; }
.tips .r { text-align: right; white-space: nowrap; font-size: 13px; }
.mob-tabs { display: none; }
@media (max-width: 640px) { .mob-tabs { display: flex; } }

svg.chart { width: 100%; height: 220px; display: block; }
.legend { display: flex; gap: 16px; font-size: 12.5px; color: var(--muted); padding: 12px 16px 0; }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
.empty { padding: 22px 16px; text-align: center; color: var(--muted); font-size: 14px; }
.empty strong { display: block; color: var(--ink); font-size: 15px; margin-bottom: 4px; }
.conn { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; margin-top: 6px; }
.conn i { width: 8px; height: 8px; border-radius: 50%; }
.conn.on i { background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 22%, transparent); } .conn.off i { background: var(--bad); }
.conn small { font-weight: 500; color: var(--muted); }
.vs .conn { flex-wrap: wrap; } .vs .side:last-child .conn { justify-content: flex-end; }
.vs .conn small { flex-basis: 100%; }
.connbox { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 12px 16px; margin-top: 14px; }
.note { font-size: 12.5px; color: var(--muted); margin: 12px 2px 0; }
/* Duell-Rennen */
.race { padding: 16px; }
.race .lead { font: 700 22px/1.15 var(--font-display); text-transform: uppercase; text-align: center; margin: 2px 0 14px; }
.race .since { text-align: center; font-size: 12.5px; color: var(--muted); margin-top: -10px; margin-bottom: 14px; }
.lane { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: end; padding: 10px 0; border-top: 1px solid var(--line); }
.lane:first-of-type { border-top: 0; }
.lane .nm { font: 700 18px/1 var(--font-display); text-transform: uppercase; }
.lane .nm small { font: 500 12.5px var(--font-body); text-transform: none; color: var(--muted); margin-left: 6px; }
.lane .amt { font: 700 34px/1 var(--font-display); font-variant-numeric: tabular-nums; text-align: right; }
.lane .amt small { font-size: 15px; color: var(--muted); margin-left: 2px; }
.lane .road { grid-column: 1 / -1; position: relative; height: 26px; margin-top: 6px; }
.lane .road::before { content: ""; position: absolute; left: 0; right: 0; top: 11px; height: 4px; border-radius: 2px; background: var(--sunken); }
.lane .road .fill { position: absolute; left: 0; top: 11px; height: 4px; border-radius: 2px; }
/* Laufende Wette: der Strich wächst animiert bis dorthin, wo er bei einem Gewinn stünde */
.gain { position: absolute; height: 4px; border-radius: 2px; transform-origin: left center; animation: gain 2.2s cubic-bezier(.4, 0, .2, 1) infinite; opacity: .55; }
.lane .road .gain { top: 11px; }
.track .gain { top: 0; bottom: 0; height: auto; }
.lane.la .gain, .ch .track .gain { background: var(--a); }
.lane.lb .gain, .ch.bside .track .gain { background: var(--b); }
.goal-tick { position: absolute; width: 2px; border-radius: 1px; opacity: .55; }
.lane .road .goal-tick { top: 7px; height: 12px; } .track .goal-tick { top: -3px; height: 12px; }
.lane.la .goal-tick, .ch .track .goal-tick { background: var(--a); }
.lane.lb .goal-tick, .ch.bside .track .goal-tick { background: var(--b); }
@keyframes gain { 0% { transform: scaleX(0); opacity: .7; } 65% { transform: scaleX(1); opacity: .55; } 100% { transform: scaleX(1); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .gain { animation: none; opacity: .3; } }
.lane .road .car { position: absolute; top: 4px; width: 18px; height: 18px; margin-left: -9px; border-radius: 50%; border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--line); transition: left .6s; }
.lane .road .pk { position: absolute; top: 6px; width: 2px; height: 14px; background: var(--muted); opacity: .6; }
.lane.la .fill, .lane.la .car { background: var(--a); } .lane.lb .fill, .lane.lb .car { background: var(--b); }
.lane .meta { grid-column: 1 / -1; font-size: 12.5px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.scale { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 2px; }
.ctl { margin-top: 14px; padding: 14px 16px; display: grid; gap: 10px; }
.ctl > * { min-width: 0; }
.ctl .line .btn { flex: none; padding: 12px 12px; }
.ctl label { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.ctl .line { display: flex; gap: 8px; }
.ctl input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); color: var(--ink); padding: 10px 12px; font: 14px var(--font-body); }
.btn { appearance: none; border: 0; border-radius: var(--radius); background: var(--a); color: var(--surface); font: 700 16px/1 var(--font-display); text-transform: uppercase; letter-spacing: .08em; padding: 12px 16px; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.warn { background: var(--bad); }
.btn:disabled { opacity: .5; cursor: default; }
.ctl .msg { font-size: 13px; color: var(--muted); }
.topbar { display: flex; justify-content: space-between; align-items: center; margin: 0 0 14px; }
.reload { appearance: none; width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--ink); cursor: pointer; }
.reload svg { width: 18px; height: 18px; }
.reload.spin svg { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
/* Aktive Wetten live */
.livegrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 700px) { .livegrid { grid-template-columns: 1fr; } }
.lv { padding: 14px 16px 12px; border-top: 3px solid var(--a); }
.lv.bside { border-top-color: var(--b); }
.lv .lvhead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.lv .lvhead h3 { font-size: 20px; }
.lv .lvhead h3.a { color: var(--a); } .lv .lvhead h3.b { color: var(--b); }
.lv .lvhead span { font-size: 12.5px; color: var(--muted); text-align: right; }
.lv .money { display: flex; align-items: baseline; gap: 8px; margin: 6px 0 4px; font-variant-numeric: tabular-nums; }
.lv .money b { font: 700 28px/1 var(--font-display); }
.lv .money .to { color: var(--muted); }
.lv .money small { margin-left: auto; font-size: 12.5px; color: var(--muted); text-align: right; }
.mrow { padding: 12px 0 10px; border-top: 1px solid var(--line); }
.mrow:first-of-type { border-top: 0; }
.mline { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.team { display: flex; align-items: center; gap: 8px; min-width: 0; font-weight: 600; font-size: 14.5px; }
.team.away { flex-direction: row-reverse; text-align: right; }
.team span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.logo { width: 30px; height: 30px; flex: none; object-fit: contain; }
.logo.ph { display: grid; place-items: center; border-radius: 50%; background: var(--sunken); color: var(--muted); font: 700 12px/1 var(--font-display); }
.sc { text-align: center; min-width: 74px; }
.sc b { font: 700 30px/1 var(--font-display); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.sc .ko { font: 700 18px/1 var(--font-display); }
.sc small { display: block; font-size: 11.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin-top: 3px; }
.sc small.live { color: var(--bad); }
.sc small.live::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--bad); margin-right: 5px; vertical-align: 1px; animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.pickline { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 8px; font-size: 13.5px; }
.pickline .pk { font-weight: 700; }
.pickline .pk small { font-weight: 500; color: var(--muted); margin-left: 4px; }
.tag { font-size: 11.5px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--sunken); color: var(--muted); white-space: nowrap; }
.tag.good { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
.tag.bad { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }
.lv .foot { margin-top: 6px; font-size: 12px; color: var(--muted); }
.tips li.open-bet { display: block; }
/* Spiele anklickbar + Spielbericht */
.mrow[data-leg], .legl[data-leg] { cursor: pointer; }
@media (hover: hover) { .mrow[data-leg]:hover .mline { opacity: .8; } .legl[data-leg]:hover { text-decoration: underline; } }
.mrow .more { font-size: 11.5px; color: var(--muted); margin-top: 4px; }
.legl { display: block; }
:root { --card-y: #E9B320; --card-r: #D23A2E; }
.sheet-bg { position: fixed; inset: 0; background: rgba(0, 0, 0, .5); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
@media (min-width: 700px) { .sheet-bg { align-items: center; padding: 24px; } }
.sheet { background: var(--bg); width: 100%; max-width: 760px; max-height: 92dvh; overflow-y: auto; border-radius: 14px 14px 0 0; padding: 14px 16px calc(24px + env(safe-area-inset-bottom, 0px)); overscroll-behavior: contain; }
@media (min-width: 700px) { .sheet { border-radius: 14px; } }
.sheet .bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 8px; }
.sheet .bar span { font-size: 12.5px; color: var(--muted); }
.sheet .x { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); width: 36px; height: 36px; border-radius: var(--radius); font-size: 18px; cursor: pointer; }
.hero { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; padding: 14px 4px 16px; text-align: center; }
.hero .t { display: grid; justify-items: center; gap: 6px; font-weight: 700; font-size: 14.5px; }
.hero .t .logo { width: 52px; height: 52px; }
.hero .t .logo.ph { font-size: 16px; }
.hero .sc b { font-size: 44px; }
.timeline { width: 100%; height: auto; display: block; }
.timeline .mid { stroke: var(--muted); stroke-width: 1.5; }
.timeline .tk { fill: var(--muted); font: 600 10px var(--font-body); }
.timeline .ht { stroke: var(--muted); stroke-dasharray: 3 3; }
.timeline .side { fill: var(--muted); font: 700 11px var(--font-display); letter-spacing: .05em; }
.timeline g[data-tip] { cursor: pointer; }
.timeline .hit { fill: transparent; }
.timeline g.sel .hit { fill: color-mix(in srgb, var(--a) 22%, transparent); }
.ic-ball { fill: var(--surface); stroke: var(--ink); stroke-width: 1.5; }
.ic-ball-c { fill: var(--ink); }
.ic-y { fill: var(--card-y); } .ic-r { fill: var(--card-r); }
.ic-in { stroke: var(--good); } .ic-out { stroke: var(--bad); }
.ic-corner { stroke: var(--muted); fill: var(--muted); }
.ic-var { fill: none; stroke: var(--bad); stroke-width: 1.5; }
.tl-info { min-height: 20px; font-size: 13px; color: var(--muted); padding: 4px 2px 0; }
.tl-tools { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 8px; }
.tl-tools .chip { display: inline-flex; align-items: center; gap: 6px; }
.ev-list { list-style: none; margin: 0; padding: 0; }
.ev-list li { display: grid; grid-template-columns: 44px 22px 1fr; gap: 8px; align-items: start; padding: 8px 14px; border-top: 1px solid var(--line); font-size: 13.5px; }
.ev-list li.away { background: color-mix(in srgb, var(--sunken) 55%, transparent); }
.ev-list .min { font: 700 15px/1.2 var(--font-display); color: var(--muted); }
.ev-list svg { width: 18px; height: 18px; margin-top: 1px; }
.ev-list small { color: var(--muted); display: block; }
.statrow { display: grid; gap: 4px; padding: 9px 14px; border-top: 1px solid var(--line); }
.statrow .nums { display: flex; justify-content: space-between; font-size: 13.5px; }
.statrow .nums b { font: 700 17px/1 var(--font-display); }
.statrow .nums span { color: var(--muted); }
.statbar { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; height: 6px; }
.statbar i { display: block; height: 100%; background: var(--sunken); border-radius: 2px; position: relative; overflow: hidden; }
.statbar i b { position: absolute; top: 0; bottom: 0; border-radius: 2px; }
.statbar i:first-child b { right: 0; background: var(--a); } .statbar i:last-child b { left: 0; background: var(--b); }
.ph-h { padding: 12px 14px 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.ph-h h3 { font-size: 17px; }
.ph-b { padding: 4px 14px 12px; }
.backlink { display: inline-block; margin: 0; font-size: 13.5px; font-weight: 600; color: var(--muted); text-decoration: none; }
footer { margin-top: 36px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<main><div class="topbar"><a class="backlink" href="./#challenge">← GoalOracle</a>
  <button class="reload" id="reload" type="button" aria-label="Aktualisieren" title="Aktualisieren"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg></button></div><div id="app"><div class="empty">Lädt …</div></div></main>
<script>
(() => {
  // ------------------------------------------------------------------
  // Hier die URL zur duel.json des Gegners eintragen (oder ?b=URL anhängen).
  const PARTNER_URL = "";
  // ------------------------------------------------------------------
  const qs = new URLSearchParams(location.search);
  const SRC = [qs.get("a") || "duel.json", qs.get("b") || PARTNER_URL];

    const head = `<div class="vs">${side(A, nameA, "a", cA)}<div class="mid">VS</div>${side(B, nameB, "b", cB)}</div>`;
    if (!A) { app.innerHTML = head + `<div class="panel empty" style="margin-top:20px"><strong>Eigene Daten fehlen</strong>duel.json konnte nicht geladen werden.</div>`; return; }
    app.innerHTML = head + `
      <h2 class="sec">Aktive Wetten</h2><div id="live"></div>
      <h2 class="sec">Challenge gesamt</h2><div id="chall"></div>
      <h2 class="sec">${CFG.started ? "Wetten seit dem Start" : "Aktueller Versuch"}</h2>
      <div class="chips mob-tabs" role="group"><button class="chip" data-s="a" aria-pressed="${mobSide === "a"}">${esc(nameA)}</button><button class="chip" data-s="b" aria-pressed="${mobSide === "b"}">${esc(nameB)}</button></div>
      <div class="lists one-${mobSide}" style="margin-top:10px">
        <div class="panel la"><div class="head">${esc(nameA)}</div><ul class="tips" id="list-a">${betList(A)}</ul></div>
        <div class="panel lb"><div class="head">${esc(nameB)}</div><ul class="tips" id="list-b">${B ? betList(B) : `<li class="muted">${SRC[1] ? "Daten nicht erreichbar." : "Kein Gegner eingetragen."}</li>`}</ul></div></div>
      <p class="note">Challenge-Regeln: Start mit 100 CHF, immer nur eine Wette offen, der ganze Betrag wird weiter eingesetzt, jede Wette etwa Quote 2. Eine verlorene Wette heisst: zurück auf 100.${CFG.started ? ` «Wetten seit dem Start» zeigt alles ab ${esc(fStamp.format(new Date(CFG.started)))}.` : ""}</p>
      ${ctlHtml()}
      <div class="panel connbox"><span><b class="a">${esc(nameA)}</b> ${connHtml(cA)}</span><span><b class="b">${esc(nameB)}</b> ${connHtml(cB)}</span></div>
      <footer><a href="#" data-act="manage" style="color:inherit">Verwalten</a> · Format tippduell/1</footer>`;
    renderLive();
  }
  document.addEventListener("click", (e) => {
    const s = e.target.closest("[data-s]"); if (s) { mobSide = s.dataset.s; render(); return; }
    const c = e.target.closest("[data-act]"); if (!c || busy) return;
    e.preventDefault();
    if (c.dataset.act === "arm") { armed = true; render(); setTimeout(() => { if (armed) { armed = false; render(); } }, 6000); }
    else if (c.dataset.act === "go") dispatch({ duel: "start" });
    else if (c.dataset.act === "manage") { manage = true; render(); setTimeout(() => { const el = $(".ctl"); if (el) el.scrollIntoView({ block: "center", behavior: "smooth" }); }, 50); }
    else if (c.dataset.act === "token") { const v = ($("#tk").value || "").trim(); if (v) { try { localStorage.setItem("go-gh-token", v); } catch (er) { /* egal */ } } render(); }
    else if (c.dataset.act === "partner") {
      const v = ($("#pu").value || "").trim();
      if (!/^https:\/\/[^\s<>"']+$/.test(v)) { ctlMsg = "Bitte einen vollständigen https-Link eingeben."; render(); return; }
      dispatch({ duel_partner: v });
    }
  });
  async function boot() {
    CFG = await fetch("duel-config.json?t=" + Date.now(), { cache: "no-store" }).then((r) => (r.ok ? r.json() : {})).catch(() => ({}));
    SRC[1] = qs.get("b") || CFG.partner_url || PARTNER_URL;
    const [a, b] = await Promise.all([load(SRC[0]).catch(() => null), SRC[1] ? load(SRC[1]).catch((e) => { errB = e.message; return null; }) : Promise.resolve(null)]);
    A = a; B = b; render(); refreshLive();
  }
  boot();
  // Aktualisieren: Seite und alle Daten frisch vom Server holen (auch in der Homescreen-App)
  $("#reload").addEventListener("click", async () => {
    const btn = $("#reload"); btn.classList.add("spin"); btn.disabled = true;
    try {
      await Promise.all([location.pathname, "duel.json", "duel-config.json"].map((u) => fetch(u, { cache: "reload" }).catch(() => null)));
      if (window.caches) { const ks = await caches.keys(); await Promise.all(ks.map((k) => caches.delete(k))); }
    } catch (e) { /* trotzdem neu laden */ }
    location.replace(location.pathname + "?r=" + Date.now() + location.hash);
  });
  if (qs.has("r")) { qs.delete("r"); history.replaceState(null, "", location.pathname + (qs.toString() ? "?" + qs : "") + location.hash); }
})();
</script>
</body>
</html>
