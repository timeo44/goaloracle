name: GoalOracle

on:
  schedule:
    # 07:00 UTC = 08:00 Uhr Schweizer Winterzeit / 09:00 Sommerzeit
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Was soll laufen?"
        type: choice
        options: [tipps, backtest]
        default: tipps

permissions:
  contents: write   # damit der Bot web/data.json speichern darf

concurrency:
  group: goaloracle
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Backtest
        if: ${{ inputs.mode == 'backtest' }}
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py --backtest

      - name: Tipps (Telegram + Web-App)
        if: ${{ inputs.mode != 'backtest' }}
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py --web web/data.json

      - name: Web-Daten speichern
        if: ${{ inputs.mode != 'backtest' }}
        run: |
          git config user.name "goaloracle-bot"
          git config user.email "goaloracle-bot@users.noreply.github.com"
          git add web/data.json
          git diff --cached --quiet || git commit -m "Tipps vom $(date -u +%d.%m.%Y)"
          git push
