name: GoalOracle

on:
  schedule:
    # 07:00 UTC = 08:00 Uhr Schweizer Winterzeit / 09:00 Sommerzeit
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write   # Tipps, Bilanz und Cache speichern
  pages: write      # Web-App veröffentlichen
  id-token: write

concurrency:
  group: goaloracle
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Tipps rechnen (Telegram + Web-App)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python bot.py

      - name: Daten speichern
        run: |
          git config user.name "goaloracle-bot"
          git config user.email "goaloracle-bot@users.noreply.github.com"
          git add web/data.json web/paper.json web/sim.json cache
          git diff --cached --quiet || git commit -m "Tipps vom $(date -u +%d.%m.%Y)"
          git pull --rebase --autostash -q || true
          git push

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v5.0.0
