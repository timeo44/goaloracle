name: GoalOracle

on:
  schedule:
    # 07:00 UTC = 08:00 Uhr Schweizer Winterzeit / 09:00 Sommerzeit
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Was soll laufen?"
        type: choice
        options: [tipps, backtest]
        default: tipps

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Bot starten
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ inputs.mode }}" = "backtest" ]; then
            python bot.py --backtest
          else
            python bot.py
          fi
