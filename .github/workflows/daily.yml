name: GoalOracle
run-name: ${{ github.event_name == 'schedule' && (github.event.schedule == '5 */2 * * *' && 'Aktualisierung (alle 2 Std.)' || 'Zeitplan') || (inputs.send_only && 'Top 5 an Telegram' || (inputs.job == 'morning' && 'Zeitplan 10 Uhr (cron-job.org)' || (inputs.job == 'refresh' && 'Aktualisierung (cron-job.org)' || 'Manueller Lauf'))) }}

on:
  schedule:
    # GitHub kennt nur UTC. Beide Zeiten laufen um 09:35 Schweizer Zeit (Sommer bzw. Winter);
    # der Plan-Schritt lässt nur den passenden laufen. Die Nachricht geht um 10:00 raus.
    - cron: "35 7 * * *"
    - cron: "35 8 * * *"
    # Montag früh: Modell-Einstellungen per Rückblick neu optimieren (ohne Nachricht)
    - cron: "15 2 * * 1"
    # Alle 2 Stunden: Resultate, Spielpläne, Bilanz und Prognosen aktualisieren (ohne Nachricht, ohne neue Quoten)
    - cron: "5 */2 * * *"
  workflow_dispatch:
    inputs:
      notify:
        description: "Telegram-Nachricht senden"
        type: boolean
        default: false
      refresh_odds:
        description: "Quoten neu laden (kostet Credits)"
        type: boolean
        default: false
      retune:
        description: "Modell-Einstellungen neu optimieren (dauert 5–10 Minuten)"
        type: boolean
        default: false
      job:
        description: "Für externe Zeitpläne: morning = 10-Uhr-Nachricht, refresh = Aktualisierung"
        type: string
        default: ""
      send_only:
        description: "Nur die heutigen Top 5 an Telegram senden (ohne Rechnen)"
        type: boolean
        default: false

permissions:
  contents: write   # Tipps, Bilanz und Cache speichern
  pages: write      # Web-App veröffentlichen
  id-token: write

concurrency:
  group: goaloracle
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Plan
        id: plan
        run: |
          RUN=true; ARGS=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            OFF=$(TZ=Europe/Zurich date +%z)
            CRON="${{ github.event.schedule }}"
            if [ "$CRON" = "15 2 * * 1" ]; then ARGS="--retune"
            elif [ "$CRON" = "5 */2 * * *" ]; then ARGS=""
            elif [ "$OFF" = "+0200" ] && [ "$CRON" = "35 7 * * *" ]; then ARGS="--notify --send-at 10:00 --refresh-odds --once"
            elif [ "$OFF" = "+0100" ] && [ "$CRON" = "35 8 * * *" ]; then ARGS="--notify --send-at 10:00 --refresh-odds --once"
            else RUN=false; fi
          else
            if [ "${{ inputs.notify }}" = "true" ]; then ARGS="$ARGS --notify"; fi
            if [ "${{ inputs.refresh_odds }}" = "true" ]; then ARGS="$ARGS --refresh-odds"; fi
            if [ "${{ inputs.retune }}" = "true" ]; then ARGS="$ARGS --retune"; fi
            if [ "${{ inputs.send_only }}" = "true" ]; then ARGS="--send-only"; fi
            if [ "${{ inputs.job }}" = "morning" ]; then ARGS="--notify --send-at 10:00 --refresh-odds --once"; fi
            if [ "${{ inputs.job }}" = "refresh" ]; then ARGS=""; fi
          fi
          SEND=false; case "$ARGS" in *--send-only*) SEND=true;; esac
          echo "send=$SEND" >> "$GITHUB_OUTPUT"
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"
          echo "Lauf: $RUN, Optionen: $ARGS"

      - uses: actions/checkout@v5
        if: steps.plan.outputs.run == 'true'
      - uses: actions/setup-python@v6
        if: steps.plan.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
        if: steps.plan.outputs.run == 'true'

      - name: Tipps rechnen
        if: steps.plan.outputs.run == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python bot.py ${{ steps.plan.outputs.args }}

      - name: Daten speichern
        if: steps.plan.outputs.run == 'true'
        run: |
          git config user.name "goaloracle-bot"
          git config user.email "goaloracle-bot@users.noreply.github.com"
          git add web/data.json web/paper.json web/sim.json web/history.json web/botd.json web/challenge.json web/duel.json web/crests cache
          git diff --cached --quiet || git commit -m "Tipps vom $(date -u +%d.%m.%Y)"
          # Bei gleichzeitigen Änderungen gewinnen die frisch gerechneten Daten
          for i in 1 2 3; do
            git pull --rebase -X theirs -q origin main && git push && break
            git rebase --abort 2>/dev/null || true
            sleep 5
          done

      - uses: actions/configure-pages@v6
        if: steps.plan.outputs.run == 'true' && steps.plan.outputs.send != 'true'
      - uses: actions/upload-pages-artifact@v5.0.0
        if: steps.plan.outputs.run == 'true' && steps.plan.outputs.send != 'true'
        with:
          path: web
      - id: deployment
        if: steps.plan.outputs.run == 'true' && steps.plan.outputs.send != 'true'
        uses: actions/deploy-pages@v5.0.0
